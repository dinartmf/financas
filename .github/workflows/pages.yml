name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas necessárias
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar que nenhuma chave secreta foi commitada
        shell: python
        run: |
          import base64, json, pathlib, re, sys
          achou = False
          for f in pathlib.Path('.').rglob('*'):
              if '.git' in f.parts or not f.is_file() or f.suffix not in {'.js', '.html', '.json'}:
                  continue
              txt = f.read_text(errors='ignore')
              if re.search(r'sb_secret_[A-Za-z0-9_-]{10,}', txt):
                  print(f'::error file={f}::Chave secreta do Supabase (sb_secret_) encontrada'); achou = True
              for tok in re.findall(r'eyJ[A-Za-z0-9_-]+\.(eyJ[A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+', txt):
                  try:
                      claims = json.loads(base64.urlsafe_b64decode(tok + '=' * (-len(tok) % 4)))
                  except Exception:
                      continue
                  if claims.get('role') == 'service_role':
                      print(f'::error file={f}::Chave service_role do Supabase encontrada'); achou = True
          sys.exit(1 if achou else 0)

      - name: Montar pasta publicada (somente arquivos do site)
        run: |
          mkdir -p _site/assets
          cp index.html config.js _site/
          cp assets/*.js assets/*.css _site/assets/
          mkdir -p _site/assets/vendor && cp -r assets/vendor/pdfjs _site/assets/vendor/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
